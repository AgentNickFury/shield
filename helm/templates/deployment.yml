# This code performs operations based on a previous interaction.
# It is assumed that the code utilizes logic or data from an earlier step.
# The code may include function definitions, variable assignments, or processing steps.
# Comments have been added to clarify the purpose and flow of the code.
# Please refer to the code for specific implementation details.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx.fullname" . }}
  # Labels for the Deployment resource
  labels:
    app: {{ .Values.appLabel | default "nginx" }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.appLabel | default "nginx" }}
  template:
    metadata:
      labels:
        app: {{ .Values.appLabel | default "nginx" }}
    spec:
      serviceAccountName: {{ include "nginx.fullname" . }}-sa
      # Init container to perform initialization tasks before main container starts
      initContainers:
        - name: {{ .Values.initContainer.name | default "init-myservice" }}
          image: {{ .Values.initContainer.image | default "busybox" }}
          command: {{ toJson .Values.initContainer.command | default "[\"sh\", \"-c\", \"echo Initializing... && sleep 5\"]" }}
      containers:
        - name: {{ .Values.container.name | default "nginx" }}
          image: {{ .Values.image.repository | default "nginx" }}:{{ .Values.image.tag | default "latest" }}
          ports:
            - containerPort: {{ .Values.container.port | default 80 }}
          # Liveness probe to check if the container is running
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path | default "/" }}
              port: {{ .Values.container.port | default 80 }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          # Readiness probe to check if the container is ready to serve traffic
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path | default "/" }}
              port: {{ .Values.container.port | default 80 }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 5 }}

          # Resource requests and limits
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}

          # Environment variables from ConfigMap and Secret
          env:
            - name: CONFIG_VALUE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.env.configMapName | default "my-configmap" }}
                  key: {{ .Values.env.configMapKey | default "config-key" }}
            - name: SECRET_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.secretName | default "my-secret" }}
                  key: {{ .Values.env.secretKey | default "secret-key" }}
          # Volume mounts
          volumeMounts:
            - name: my-volume
              mountPath: {{ .Values.volumeMount.mountPath | default "/usr/share/nginx/html" }}
      # Volumes
      volumes:
        - name: my-volume
          emptyDir: {}
        # Persistent volume claim
        - name: my-pvc
          persistentVolumeClaim:
            claimName: {{ .Values.persistentVolumeClaim.name | default "my-pvc" }}
---
# RBAC configuration for the deployment 
# This section defines the ServiceAccount, Role, and RoleBinding for the deployment
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nginx.fullname" . }}-sa
  labels:
    app: {{ .Values.appLabel | default "nginx" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nginx.fullname" . }}-role
  labels:
    app: {{ .Values.appLabel | default "nginx" }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nginx.fullname" . }}-rolebinding
  labels:
    app: {{ .Values.appLabel | default "nginx" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nginx.fullname" . }}-sa
roleRef:
  kind: Role
  name: {{ include "nginx.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
---
# Service configuration for the deployment
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx.fullname" . }}-service
  labels:
    app: {{ .Values.appLabel | default "nginx" }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.container.port | default 80 }}
  selector:
    app: {{ .Values.appLabel | default "nginx" }}
---
# Network Policy configuration for the deployment
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy 
metadata:
  name: {{ include "nginx.fullname" . }}-network-policy
  labels:
    app: {{ .Values.appLabel | default "nginx" }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.appLabel | default "nginx" }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.appLabel | default "nginx" }}
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.appLabel | default "nginx" }}
      ports:
        - protocol: TCP
          port: 80
---
# Pod Anti-Affinity configuration for the deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx.fullname" . }}-anti-affinity
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.appLabel | default "nginx" }}
  template:
    metadata:
      labels:
        app: {{ .Values.appLabel | default "nginx" }}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ .Values.appLabel | default "nginx" }}
              topologyKey: "kubernetes.io/hostname"
---
# Pod Affinity configuration for the deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx.fullname" . }}-affinity
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.appLabel | default "nginx" }}
  template:
    metadata:
      labels:
        app: {{ .Values.appLabel | default "nginx" }}
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ .Values.appLabel | default "nginx" }}
              topologyKey: "kubernetes.io/hostname"
# Pod Security Policy configuration for the deployment (deprecated in newer Kubernetes versions)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: {{ include "nginx.fullname" . }}-psp
  labels:
    app: {{ .Values.appLabel | default "nginx" }}
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'persistentVolumeClaim'
    - 'secret'
  runAsUser:
    rule: 'RunAsAny'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistentVolumeClaim.name | default "my-pvc" }}
spec:
  accessModes:
    - {{ .Values.persistentVolumeClaim.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistentVolumeClaim.size | default "1Gi" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.env.configMapName | default "my-configmap" }}
data:
  {{ .Values.env.configMapKey | default "config-key" }}: {{ .Values.env.configMapValue | default "config-value" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.env.secretName | default "my-secret" }}
type: Opaque
data:
  {{ .Values.env.secretKey | default "secret-key" }}: {{ .Values.env.secretValue | default "c2VjcmV0LXZhbHVl" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nginx.fullname" . }}-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: / 
spec:
  rules:
    - host: {{ .Values.ingress.host | default "example.com" }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "nginx.fullname" . }}-service
                port:
                  number: {{ .Values.service.port | default 80 }}
---
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nginx.fullname" . }}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nginx.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas | default 1 }}
  maxReplicas: {{ .Values.hpa.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage | default 50 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nginx.fullname" . }}-cronjob
spec:
  schedule: {{ .Values.cronjob.schedule | quote | default "\"*/5 * * * *\"" }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: {{ .Values.container.name | default "nginx" }}
              image: {{ .Values.image.repository | default "nginx" }}:{{ .Values.image.tag | default "latest" }}
              ports:
                - containerPort: {{ .Values.container.port | default 80 }}
          restartPolicy: OnFailure
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nginx.fullname" . }}-pdb
spec:
  minAvailable: {{ .Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.appLabel | default "nginx" }}
